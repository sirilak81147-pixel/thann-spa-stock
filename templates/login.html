<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THANN Stock Login</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="login"><div class="loginbox"><h1 style="color:#274c3f">THANN SPA</h1><p>ระบบจัดการสต๊อก 4 สาขา</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div style="color:#b94c4c;margin:8px 0">{{m}}</div>{% endfor %}{% endwith %}
<div class="login-tabs"><button type="button" class="login-tab active" onclick="showLogin('admin',this)">Admin</button><button type="button" class="login-tab" onclick="showLogin('staff',this)">Staff</button></div>
<form method="post" id="adminForm"><input type="hidden" name="login_type" value="admin"><div class="field"><label>ชื่อผู้ใช้ Admin</label><input name="username" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" required></div><button type="submit">เข้าสู่ระบบ</button></form>
<form method="post" id="staffForm" style="display:none"><input type="hidden" name="login_type" value="staff"><div class="field"><label>ชื่อพนักงาน</label><input name="employee_name" placeholder="กรอกชื่อ–นามสกุล" required></div><div class="field"><label>รหัสพนักงาน</label><input name="employee_id" placeholder="เช่น ST001" required></div><button type="submit">เข้าสู่ระบบ Staff</button></form>
<p class="muted" style="margin-top:14px">Admin: admin / thann1234<br>Staff: เข้าด้วยชื่อและรหัสพนักงาน</p></div></div>
<script>function showLogin(type,btn){document.getElementById('adminForm').style.display=type==='admin'?'block':'none';document.getElementById('staffForm').style.display=type==='staff'?'block':'none';document.querySelectorAll('.login-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('#adminForm input,#staffForm input').forEach(x=>{if(x.name!=='login_type')x.required=(type==='admin'&&x.form.id==='adminForm')||(type==='staff'&&x.form.id==='staffForm')})}</script></body></html>
